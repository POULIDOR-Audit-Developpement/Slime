<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SLIME — endless runner pixel-art</title>
<meta name="description" content="SLIME : endless runner rétro où la caméra accélère sans pitié. Double saut bullet time, ledge catch, éditeur de niveaux intégré et sync LAN."/>
<link rel="icon" href="ASSETS/sprites/game/hud_head.png"/>
<style>
  :root {
    --bg: #05050e; --panel: #131735; --panel2: #1c2148; --line: #2e2e5e;
    --txt: #d8e8f4; --dim: #8a8ab0; --acc: #3ecb3e; --gold: #ffd83d; --red: #e23b3b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--txt);
    font: 16px/1.6 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }
  img { image-rendering: pixelated; }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ---------- sélecteur de langue ---------- */
  #langBar { position: fixed; top: 12px; right: 14px; z-index: 10; display: flex; gap: 4px; }
  #langBar button {
    padding: 5px 10px; font: 700 12px 'Segoe UI', system-ui; cursor: pointer;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
  }
  #langBar button.on { background: var(--acc); color: #062806; border-color: var(--acc); }

  /* ---------- héros ---------- */
  header.hero {
    position: relative; min-height: 92vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #10173a 0%, transparent 60%),
      var(--bg);
  }
  .floatPanel {
    position: absolute; opacity: .10; pointer-events: none;
    animation: floaty 9s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-18px) } }
  .logo {
    font-size: clamp(64px, 14vw, 150px); font-weight: 900; letter-spacing: .08em;
    color: var(--acc); line-height: 1;
    text-shadow:
      0 4px 0 #12521d, 0 8px 0 #0a0a12, 0 0 34px rgba(62,203,62,.45);
  }
  .logo small {
    display: block; font-size: clamp(14px, 2.4vw, 20px); font-weight: 700;
    color: var(--gold); letter-spacing: .5em; text-shadow: 0 2px 0 #0a0a12; margin-top: 14px;
  }
  .tagline { max-width: 560px; margin: 26px auto 34px; color: var(--txt); font-size: clamp(15px, 2.2vw, 19px); }
  .stage {
    position: relative; width: 220px; height: 210px; margin: 0 auto;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .stage img#slime {
    width: 110px; bottom: 26px; position: absolute;
    filter: drop-shadow(0 10px 0 rgba(0,0,0,.35));
    transition: transform .12s ease-out;
  }
  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 52px;
    background: url('ASSETS/sprites/game/tile_green.png') left top / 64px 48px repeat-x;
    image-rendering: pixelated;
    border-bottom: 4px solid #0a0a12;
  }
  .ctaRow { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 13px 30px; font-weight: 800; font-size: 16px;
    background: var(--acc); color: #062806; border: 0; cursor: pointer;
    box-shadow: 0 5px 0 #12521d, 0 8px 0 #0a0a12; letter-spacing: .06em;
  }
  .btn:hover { transform: translateY(-2px); text-decoration: none; }
  .btn.gold { background: var(--gold); color: #0a0a12; box-shadow: 0 5px 0 #8f6a0f, 0 8px 0 #0a0a12; }
  .btn.ghost { background: var(--panel2); color: var(--txt); box-shadow: 0 5px 0 #141840, 0 8px 0 #0a0a12; }

  /* ---------- sections ---------- */
  section { padding: 76px 0; }
  section.alt { background: #0a0d1e; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); }
  h2 {
    font-size: clamp(24px, 4vw, 34px); color: var(--acc); letter-spacing: .04em;
    margin-bottom: 10px; text-shadow: 0 3px 0 #0a0a12;
  }
  .sub { color: var(--dim); margin-bottom: 38px; max-width: 640px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
  .card {
    background: var(--panel); border: 2px solid var(--line); padding: 22px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .card:hover { border-color: var(--acc); }
  .card h3 { color: var(--gold); font-size: 17px; letter-spacing: .03em; }
  .card p { color: var(--txt); font-size: 14.5px; }
  .card .art {
    height: 120px; display: flex; align-items: flex-end; justify-content: center; gap: 10px;
    background: repeating-linear-gradient(45deg, #10142e 0 14px, #0d1126 14px 28px);
    border: 1px solid var(--line); overflow: hidden; padding: 10px;
  }
  .spin { animation: spin 7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .bob { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }

  /* types de plateformes */
  .plats { display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; }
  .plat { text-align: center; width: 128px; }
  .plat img { width: 96px; height: 72px; }
  .plat b { display: block; margin-top: 8px; font-size: 13.5px; }
  .plat span { color: var(--dim); font-size: 12.5px; }

  /* jauge */
  .gaugeBox { display: flex; align-items: center; gap: 18px; background: var(--panel); border: 2px solid var(--line); padding: 22px; max-width: 640px; }
  .gaugeBox img.arrow { width: 66px; }
  .gaugeBar { position: relative; flex: 1; }
  .gaugeBar .fill {
    height: 46px; background: url('ASSETS/sprites/game/gauge_bar.png') left center / auto 46px repeat-x;
    image-rendering: pixelated; animation: fillg 5s ease-in-out infinite alternate;
  }
  @keyframes fillg { from { width: 8% } to { width: 100% } }

  /* mort */
  .deathStrip img { width: 110px; height: 110px; display: none; }
  .deathStrip img.on { display: block; }

  /* galerie */
  .gallery { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; align-items: flex-end; }
  .gallery figure { text-align: center; }
  .gallery img { height: 72px; width: auto; }
  .gallery figcaption { color: var(--dim); font-size: 12px; margin-top: 8px; }

  /* éditeur */
  .editGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 30px; }
  .editCard { background: var(--panel2); border: 2px solid var(--line); padding: 20px; }
  .editCard b { color: var(--acc); }
  .editCard p { font-size: 14px; color: var(--txt); margin-top: 6px; }

  footer { border-top: 2px solid var(--line); padding: 30px 0 44px; color: var(--dim); font-size: 14px; }
  footer .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  footer img { height: 34px; vertical-align: middle; }
  @media (max-width: 560px) { .stage { transform: scale(.8); } }
</style>
</head>
<body>

<div id="langBar">
  <button data-lang="fr" class="on">FR</button>
  <button data-lang="en">EN</button>
  <button data-lang="zh">中文</button>
</div>

<header class="hero">
  <img class="floatPanel" src="ASSETS/sprites/game/bg_panel1.png" style="width:130px;left:8%;top:18%" alt=""/>
  <img class="floatPanel" src="ASSETS/sprites/game/bg_panel2.png" style="width:110px;right:10%;top:24%;animation-delay:-3s" alt=""/>
  <img class="floatPanel" src="ASSETS/sprites/game/bg_panel3.png" style="width:120px;left:16%;bottom:16%;animation-delay:-5s" alt=""/>
  <img class="floatPanel" src="ASSETS/sprites/game/bg_panel4.png" style="width:100px;right:18%;bottom:20%;animation-delay:-7s" alt=""/>
  <div class="wrap">
    <h1 class="logo">SLIME<small>ENDLESS RUNNER</small></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <div class="stage">
      <img id="slime" src="ASSETS/sprites/game/idle0.png" alt="Slime animé"/>
      <div class="ground"></div>
    </div>
    <div class="ctaRow">
      <a class="btn" href="play.html" data-i18n="play"></a>
      <a class="btn gold" href="editor.html" data-i18n="editor"></a>
      <a class="btn ghost" href="https://github.com/POULIDOR-Audit-Developpement/Slime" data-i18n="src"></a>
    </div>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="grid">
      <div class="card">
        <div class="art"><img src="ASSETS/sprites/game/jump.png" style="height:100px" alt="Saut"/></div>
        <h3 data-i18n="fAim"></h3>
        <p data-i18n="fAimP"></p>
      </div>
      <div class="card">
        <div class="art">
          <img src="ASSETS/sprites/game/time_warp.png" class="spin" style="height:96px" alt="Bullet time"/>
          <img src="ASSETS/sprites/game/dj_pump1.png" style="height:76px" alt="Double saut"/>
        </div>
        <h3 data-i18n="fDj"></h3>
        <p data-i18n="fDjP"></p>
      </div>
      <div class="card">
        <div class="art"><img src="ASSETS/sprites/game/ledge0.png" style="height:104px" alt="Ledge catch"/></div>
        <h3 data-i18n="fLedge"></h3>
        <p data-i18n="fLedgeP"></p>
      </div>
      <div class="card">
        <div class="art"><img src="ASSETS/sprites/game/bonus_life.png" class="bob" style="height:60px" alt="Bonus vie"/></div>
        <h3 data-i18n="fBonus"></h3>
        <p data-i18n="fBonusP"></p>
      </div>
      <div class="card">
        <div class="art deathStrip" id="deathStrip">
          <img class="on" src="ASSETS/sprites/game/death1.png" alt="Mort"/>
          <img src="ASSETS/sprites/game/death2.png" alt=""/>
          <img src="ASSETS/sprites/game/death3.png" alt=""/>
          <img src="ASSETS/sprites/game/splat.png" alt=""/>
        </div>
        <h3 data-i18n="fDeath"></h3>
        <p data-i18n="fDeathP"></p>
      </div>
      <div class="card">
        <div class="art"><img src="ASSETS/sprites/game/idle0_red.png" style="height:80px" alt="Slime rouge"/></div>
        <h3 data-i18n="fDiff"></h3>
        <p data-i18n="fDiffP"></p>
      </div>
    </div>
  </div>
</section>

<section class="alt">
  <div class="wrap">
    <h2 data-i18n="platsTitle"></h2>
    <p class="sub" data-i18n="platsSub"></p>
    <div class="plats">
      <div class="plat"><img src="ASSETS/sprites/game/tile_green.png" alt=""/><b data-i18n="pBase"></b><span data-i18n="pBaseS"></span></div>
      <div class="plat"><img src="ASSETS/sprites/game/sticky.png" style="width:96px;height:65px" alt=""/><b data-i18n="pSticky"></b><span data-i18n="pStickyS"></span></div>
      <div class="plat"><img src="ASSETS/sprites/game/tile_blue.png" alt=""/><b data-i18n="pDyn"></b><span data-i18n="pDynS"></span></div>
      <div class="plat"><img src="ASSETS/sprites/game/tile_gray.png" alt=""/><b data-i18n="pCrumble"></b><span data-i18n="pCrumbleS"></span></div>
      <div class="plat"><img src="ASSETS/sprites/game/tile_ghost.png" alt=""/><b data-i18n="pGhost"></b><span data-i18n="pGhostS"></span></div>
      <div class="plat"><img src="ASSETS/sprites/game/tile_orange.png" alt=""/><b data-i18n="pBouncy"></b><span data-i18n="pBouncyS"></span></div>
    </div>
    <div style="margin-top:46px">
      <h2 style="font-size:clamp(20px,3.4vw,28px)" data-i18n="speedTitle"></h2>
      <p class="sub" data-i18n="speedSub"></p>
      <div class="gaugeBox">
        <img class="arrow" src="ASSETS/sprites/game/speed_arrow.png" alt="Vitesse"/>
        <div class="gaugeBar"><div class="fill"></div></div>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-i18n="editTitle"></h2>
    <p class="sub" data-i18n="editSub"></p>
    <div class="editGrid">
      <div class="editCard"><b data-i18n="ePat"></b><p data-i18n="ePatP"></p></div>
      <div class="editCard"><b data-i18n="eVue"></b><p data-i18n="eVueP"></p></div>
      <div class="editCard"><b data-i18n="eLan"></b><p data-i18n="eLanP"></p></div>
    </div>
    <div class="ctaRow"><a class="btn gold" href="editor.html" data-i18n="editCta"></a></div>
  </div>
</section>

<section class="alt">
  <div class="wrap">
    <h2 data-i18n="galTitle"></h2>
    <p class="sub" data-i18n="galSub"></p>
    <div class="gallery">
      <figure><img src="ASSETS/sprites/game/idle0.png" alt=""/><figcaption>idle</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/jump.png" alt=""/><figcaption>jump</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/fall.png" alt=""/><figcaption>fall</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/land.png" alt=""/><figcaption>land</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/hurt.png" alt=""/><figcaption>hurt</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/dj_pump0.png" style="height:56px" alt=""/><figcaption>pump</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/hud_head.png" alt=""/><figcaption>life</figcaption></figure>
      <figure><img src="ASSETS/sprites/game/big.png" alt=""/><figcaption>hero</figcaption></figure>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <span><img src="ASSETS/sprites/game/idle1.png" alt=""/> <span data-i18n="foot"></span></span>
    <span><a href="play.html" data-i18n="play"></a> · <a href="editor.html" data-i18n="editor"></a> · <a href="https://github.com/POULIDOR-Audit-Developpement/Slime">GitHub</a></span>
  </div>
</footer>

<script src="js/i18n.js?v=20260926a"></script>
<script>
  // Démo héros : cycle idle -> saut -> chute -> atterrissage avec les vrais
  // sprites du jeu, pieds calés sur la ligne de sol.
  const A = 'ASSETS/sprites/game/'
  const slime = document.getElementById('slime')
  const seq = [
    { s: 'idle0', dy: 0,   sc: 1,    d: 420 },
    { s: 'idle1', dy: 3,   sc: 1.04, d: 420 },
    { s: 'idle0', dy: 0,   sc: 1,    d: 300 },
    { s: 'jump',  dy: -52, sc: 1,    d: 380 },
    { s: 'fall',  dy: 4,   sc: 1,    d: 320 },
    { s: 'land',  dy: 0,   sc: 1,    d: 240 }
  ]
  let i = 0
  function next() {
    const f = seq[i]
    slime.src = A + f.s + '.png'
    slime.style.transform = 'translateY(' + f.dy + 'px) scaleX(' + f.sc + ')'
    setTimeout(next, f.d)
    i = (i + 1) % seq.length
  }
  next()

  // Bande de mort : splat -> gouttes -> bulles -> boucle.
  const deaths = document.querySelectorAll('#deathStrip img')
  let di = 0
  setInterval(() => {
    deaths.forEach((im, k) => im.classList.toggle('on', k === di))
    di = (di + 1) % deaths.length
  }, 380)

  // Sélecteur de langue (boutons synchronisés avec js/i18n.js).
  const bar = document.getElementById('langBar')
  function refreshBar() {
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.lang === I18N.get()))
  }
  bar.addEventListener('click', e => {
    const l = e.target && e.target.dataset && e.target.dataset.lang
    if (l) I18N.set(l)
  })
  I18N.onChange(refreshBar)
  refreshBar()
</script>
</body>
</html>
