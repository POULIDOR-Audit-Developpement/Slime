const SECRET = 'S1!m3~Vault#K7-2026'

function sha256Digest(msg) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]
  const rrot = (v, n) => (v >>> n) | (v << (32 - n))
  const l = msg.length
  const words = []
  for (let i = 0; i < l; i++) words[i >> 2] = (words[i >> 2] || 0) | (msg.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8)
  words[l >> 2] = (words[l >> 2] || 0) | (0x80 << (24 - (l % 4) * 8))
  const nBlocks = Math.ceil((l + 9) / 64)
  words[nBlocks * 16 - 1] = (words[nBlocks * 16 - 1] || 0) | (l * 8)
  for (let b = 0; b < nBlocks; b++) {
    const w = []
    for (let j = 0; j < 16; j++) w[j] = words[b * 16 + j] || 0
    for (let j = 16; j < 64; j++) {
      const s0 = rrot(w[j - 15], 7) ^ rrot(w[j - 15], 18) ^ (w[j - 15] >>> 3)
      const s1 = rrot(w[j - 2], 17) ^ rrot(w[j - 2], 19) ^ (w[j - 2] >>> 10)
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0
    }
    let a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7]
    for (let j = 0; j < 64; j++) {
      const S1 = rrot(e, 6) ^ rrot(e, 11) ^ rrot(e, 25)
      const ch = (e & f) ^ (~e & g)
      const t1 = (h + S1 + ch + K[j] + w[j]) | 0
      const S0 = rrot(a, 2) ^ rrot(a, 13) ^ rrot(a, 22)
      const maj = (a & bb) ^ (a & c) ^ (bb & c)
      const t2 = (S0 + maj) | 0
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0
  }
  return H
}

function toHex(words) {
  let hex = ''
  for (let i = 0; i < words.length; i++) hex += ((words[i] >>> 0).toString(16)).padStart(8, '0')
  return hex
}

function sha256Hex(msg) {
  return toHex(sha256Digest(msg))
}

function hmacHex(key, msg) {
  let o = '', i = ''
  for (let n = 0; n < 64; n++) {
    const c = n < key.length ? key.charCodeAt(n) & 0xff : 0
    o += String.fromCharCode(c ^ 0x5c)
    i += String.fromCharCode(c ^ 0x36)
  }
  const inner = sha256Digest(i + msg)
  let innerStr = ''
  for (let n = 0; n < inner.length; n++) {
    innerStr += String.fromCharCode((inner[n] >>> 24) & 0xff, (inner[n] >>> 16) & 0xff, (inner[n] >>> 8) & 0xff, inner[n] & 0xff)
  }
  return sha256Hex(o + innerStr)
}

function b64url(s) {
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
}

function makeCode(score) {
  const body = b64url(score + '.' + Date.now())
  return body + '.' + hmacHex(SECRET, body).slice(0, 32)
}

litecanvas({ width: 480, height: 270, autoscale: true })

const CELL = 32, RS = 38, ROW0 = 88, CEIL = 16, GRAV = 620
const VERSION = '2.0'
const VMIN = 210, VMAX = 360, CHARGE_T = 0.55, STICKY_MUL = 0.8, SPIKE_W = 14
const BOUNCE_VY = 400, BOUNCE_VX = 140, CRUMBLE_T = 0.5, GOLD_PTS = 50

const COLORS = [
  '#0d0d21', '#191936', '#232348', '#2e2e5e',
  '#3ecb3e', '#1f7a1f', '#a5f0a5',
  '#3fbf46', '#1d7c2c', '#12521d',
  '#a06c33', '#7d5222', '#573813',
  '#38b6e8', '#1c7fb0', '#0e4d70',
  '#ffd83d', '#ff9d2e',
  '#e23b3b', '#8f1f1f',
  '#f4f4f4', '#0a0a12',
  '#6fdc4f', '#8a8ab0',
  '#9aa0ac', '#6b7280', '#3f4652',
  '#d8e8f4', '#a8bccb', '#7e93a3',
  '#cc6d1a', '#8f4a0f',
  '#ffd700'
]
const C_BG0 = 0, C_BG1 = 1, C_BG2 = 2, C_BG3 = 3
const C_SLIME = 4, C_SLIME_D = 5, C_SLIME_L = 6
const C_P_TOP = 7, C_P_SIDE = 8, C_P_DARK = 9
const C_S_TOP = 10, C_S_SIDE = 11, C_S_DARK = 12
const C_D_TOP = 13, C_D_SIDE = 14, C_D_DARK = 15
const C_YELLOW = 16, C_ORANGE = 17
const C_RED = 18, C_RED_D = 19
const C_WHITE = 20, C_BLACK = 21, C_GREEN = 22, C_GRAY = 23
const C_CR_TOP = 24, C_CR_SIDE = 25, C_CR_DARK = 26
const C_GH_TOP = 27, C_GH_SIDE = 28, C_GH_DARK = 29
const C_BO_SIDE = 30, C_BO_DARK = 31
const C_GOLD = 32

const SFX_JUMP = [,,392,,.03,.12,1,3.6,,69,,,,,,,,.95,.1]
const SFX_COIN = [,,1675,,.06,.24,1,1.82,,,837,.06]
const SFX_HURT = [,,537,.02,.02,.22,1,1.59,-6.98,4.97]
const SFX_DIE = [,,333,.01,0,.9,4,1.9,,,,,,.5,,.6]
const SFX_LAND = [2,.8,999,,,,,1.5,,.3,-99,.1,1.63,,,.11,.22]

const MUSIC_BASS = [0.15, 0, 55, 0.01, 0.1, 0.9, 1, 1.6]
const MUSIC_LEAD = [0.08, 0, 220, 0.005, 0.05, 0.4, 1, 3]
const BASS_PAT = [55, 0, 55, 0, 65, 0, 55, 0, 49, 0, 49, 0, 58, 0, 65, 0]
const LEAD_PAT = [220, 0, 262, 0, 294, 0, 330, 294, 0, 262, 0, 220, 0, 196, 220, 0]

const LETTERS = {
  S: ['.####', '#....', '.###.', '....#', '####.'],
  L: ['#....', '#....', '#....', '#....', '#####'],
  I: ['#####', '..#..', '..#..', '..#..', '#####'],
  M: ['#...#', '##.##', '#.#.#', '#...#', '#...#'],
  E: ['#####', '#....', '####.', '#....', '#####']
}

let state = 'title'
let camX = 0, camSpd = 40, elapsed = 0
let platforms = [], balls = [], particles = []
let slime = null
let charge = { on: false, t: 0, id: -1, aim: { x: 0, y: 0 } }
let ballsCollected = 0, goldsCollected = 0, scoreCode = null, deathT = 0, shakeT = 0
let muted = false, best = 0, newRecord = false
let musicStep = 0, musicT = 0

function rowY(r) { return ROW0 + r * RS }
function slimeR() { return 9 + slime.size * 3 }
function currentScore() { return Math.floor(camX / 10) + ballsCollected * 10 + goldsCollected * GOLD_PTS }

function h32(n) {
  n = Math.imul(n ^ (n >>> 16), 2246822519)
  n = Math.imul(n ^ (n >>> 13), 3266489917)
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296
}

function simLandV(sx, sy, vx, vy, target) {
  let x = sx, y = sy
  const dt = 1 / 60, r = 13
  for (let i = 0; i < 240; i++) {
    vy += GRAV * dt
    x += vx * dt
    y += vy * dt
    if (y - r < CEIL) { y = CEIL + r; if (vy < 0) vy = 0 }
    if (vy >= 0 && x > target.x - 3 && x < target.x + target.w + 3 && y + r >= target.y && y + r <= target.y + 16) return true
    if (y > H + 60) return false
  }
  return false
}

function canReach(a, target, mul, dirX) {
  dirX = dirX || 1
  const sx = dirX > 0 ? a.x + a.w - 10 : a.x + 10
  const sy = a.y - 12
  for (const p of [1, 0.85]) {
    for (let k = 0; k < 7; k++) {
      const base = 0.5 + k * 0.13
      const ang = dirX > 0 ? -base : -(Math.PI - base)
      const v = VMAX * p * mul
      if (simLandV(sx, sy, Math.cos(ang) * v, Math.sin(ang) * v, target)) return true
    }
  }
  return false
}

function canReachBounce(a, target) {
  return simLandV(a.x + a.w - 10, a.y - 12, BOUNCE_VX, -BOUNCE_VY, target)
}

function spawnBalls(a, b, gapCells) {
  if (rand() < 0.62) {
    const gx = a.x + a.w + gapCells * CELL / 2
    const top = Math.min(a.y, b.y)
    for (let i = -1; i <= 1; i++) {
      const by = clamp(top - 30 - (i === 0 ? 12 : 0), CEIL + 14, 252)
      balls.push({ x: gx + i * 13, y: by, o: rand() < 0.3, taken: false })
    }
  } else if (b.w >= 3 * CELL && rand() < 0.45) {
    for (let i = 0; i < 3; i++) balls.push({ x: b.x + b.w / 2 + (i - 1) * 14, y: b.y - 12, o: rand() < 0.3, taken: false })
  }
}

function spawnBranch(anchor) {
  if (elapsed < 20 || rand() > 0.45) return
  const dRow = rand() < 0.5 ? -2 : 2
  const row = clamp(anchor.row + dRow, 0, 4)
  if (row === anchor.row) return
  const p = { x: anchor.x - randi(3, 6) * CELL, row, y: rowY(row), baseY: rowY(row), w: 2 * CELL, type: 'basic', amp: 0, spd: 0, ph: 0, spike: null, branch: true }
  if (p.x < camX + 30) return
  for (const q of platforms) {
    if (q.dead) continue
    if (p.x < q.x + q.w + 8 && p.x + p.w > q.x - 8 && Math.abs(p.y - q.y) < 24) return
  }
  if (!canReach(anchor, p, 1, -1)) return
  platforms.push(p)
  balls.push({ x: p.x + p.w / 2, y: p.y - 14, o: false, taken: false, gold: true })
  balls.push({ x: p.x + p.w + CELL, y: (p.y + anchor.y) / 2 - 8, o: rand() < 0.4, taken: false })
}

function spawnNext() {
  const last = platforms[platforms.length - 1]
  const D = Math.min(elapsed / 75, 1)
  for (let attempt = 0; attempt < 24; attempt++) {
    let gap = 2 + randi(0, Math.round(2 * D))
    let dRow = randi(-2, 2)
    const roll = rand()
    let type
    if (roll < 0.38) type = 'basic'
    else if (roll < 0.51) type = 'dynamic'
    else if (roll < 0.62) type = elapsed > 12 ? 'crumble' : 'basic'
    else if (roll < 0.72) type = 'sticky'
    else if (roll < 0.82) type = elapsed > 12 ? 'ghost' : 'basic'
    else if (roll < 0.92) type = elapsed > 25 ? 'bouncy' : 'basic'
    else type = 'basic'
    let cells
    if (type === 'basic') cells = randi(2, 5)
    else if (type === 'dynamic' || type === 'sticky' || type === 'ghost') cells = randi(2, 3)
    else if (type === 'crumble') cells = randi(2, 4)
    else cells = 2
    if (elapsed < 10) { gap = Math.min(gap, 2); dRow = clamp(dRow, -1, 1); type = 'basic'; cells = randi(3, 4) }
    if (dRow === -2 && gap > 2) dRow = -1
    if (last.type === 'sticky') { gap = Math.min(gap, 3); if (dRow < -1) dRow = -1; if (dRow === -1 && gap > 2) gap = 2 }
    if (last.type === 'bouncy' && dRow < -1) dRow = -1
    const row = clamp(last.row + dRow, 0, 4)
    const p = { x: last.x + last.w + gap * CELL, row, y: rowY(row), baseY: rowY(row), w: cells * CELL, type, amp: 0, spd: 0, ph: 0, spike: null }
    if (type === 'dynamic') {
      p.amp = rand(16, 34)
      p.spd = rand(1.2, 2.1)
      p.ph = rand(0, TAU)
      p.baseY = clamp(p.baseY, CEIL + 24 + p.amp, 248 - p.amp)
      p.y = p.baseY
    }
    if (type === 'basic' && cells >= 4 && elapsed > 20 && rand() < 0.3) {
      p.spike = { x1: p.x + p.w * 0.28, x2: p.x + p.w * 0.78 }
    }
    const checkY = type === 'dynamic' ? p.baseY - p.amp * 0.7 : p.y
    const target = { x: p.x, y: checkY, w: p.w }
    const ok = last.type === 'bouncy' ? canReachBounce(last, target) : canReach(last, target, last.type === 'sticky' ? STICKY_MUL : 1, 1)
    if (ok) {
      platforms.push(p)
      spawnBalls(last, p, gap)
      spawnBranch(p)
      return
    }
  }
  const p = { x: last.x + last.w + 2 * CELL, row: last.row, y: rowY(last.row), baseY: rowY(last.row), w: 3 * CELL, type: 'basic', amp: 0, spd: 0, ph: 0, spike: null }
  platforms.push(p)
  spawnBalls(last, p, 2)
}

function genUntil() {
  const last = platforms[platforms.length - 1]
  if (last.x + last.w < camX + W + 240) spawnNext()
}

function cleanup() {
  platforms = platforms.filter(p => !p.dead && p.x + p.w > camX - 80)
  balls = balls.filter(b => !b.taken && b.x > camX - 40)
}

function killPlat(p, color) {
  if (p.dead) return
  p.dead = true
  burst(p.x + p.w / 2, p.y + 6, color, 10, 110)
  if (slime.groundPlat === p) {
    slime.grounded = false
    slime.groundPlat = null
  }
}

function burst(x, y, color, n, pow) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: rand(-pow, pow), vy: rand(-pow, 0), life: rand(0.3, 0.7), c: color, r: rand(1.5, 3) })
  }
}

function startGame() {
  elapsed = 0
  camX = 0
  camSpd = 40
  platforms = []
  balls = []
  particles = []
  ballsCollected = 0
  goldsCollected = 0
  newRecord = false
  scoreCode = null
  deathT = 0
  shakeT = 0
  charge = { on: false, t: 0, id: -1, aim: { x: 0, y: 0 } }
  const first = { x: 16, row: 2, y: rowY(2), baseY: rowY(2), w: 5 * CELL, type: 'basic', amp: 0, spd: 0, ph: 0, spike: null }
  platforms.push(first)
  slime = { x: 80, y: rowY(2) - 18, vx: 0, vy: 0, size: 3, grounded: true, groundPlat: first, jumpMul: 1, invuln: 0, squashT: 0 }
  slime.r = slimeR()
  for (let i = 0; i < 20; i++) genUntil()
  state = 'playing'
}

function damage() {
  if (slime.invuln > 0) return
  slime.size--
  slime.invuln = 1.3
  shakeT = 0.25
  sfx(SFX_HURT)
  burst(slime.x, slime.y, C_SLIME, 8, 120)
  if (slime.size < 1) die()
}

function die() {
  if (state === 'over') return
  state = 'over'
  deathT = 0
  const s = currentScore()
  newRecord = s > best && s > 0
  if (newRecord) {
    best = s
    try { localStorage.setItem('slime_best', String(best)) } catch (e) {}
  }
  scoreCode = makeCode(s)
  shakeT = 0.4
  sfx(SFX_DIE)
  burst(slime.x, slime.y, C_SLIME, 24, 220)
  burst(slime.x, slime.y, C_SLIME_L, 12, 160)
}

function doJump() {
  const p = 0.12 + 0.88 * Math.min(charge.t / CHARGE_T, 1)
  const v = lerp(VMIN, VMAX, p) * slime.jumpMul
  const gp = slime.groundPlat
  const ang = Math.atan2(charge.aim.y - slime.y, charge.aim.x - slime.x)
  slime.vx = Math.cos(ang) * v
  slime.vy = Math.sin(ang) * v
  if (gp && gp.type === 'ghost') {
    killPlat(gp, C_GH_SIDE)
    sfx(SFX_COIN, -4, 0.4)
  }
  slime.grounded = false
  slime.groundPlat = null
  slime.jumpMul = 1
  sfx(SFX_JUMP)
}

function land(p) {
  if (p.type === 'bouncy') {
    slime.vy = -BOUNCE_VY
    if (Math.abs(slime.vx) < BOUNCE_VX) slime.vx = BOUNCE_VX
    slime.squashT = 0.12
    sfx(SFX_LAND, -2, 0.7)
    return
  }
  slime.grounded = true
  slime.groundPlat = p
  slime.vy = 0
  slime.y = p.y - slime.r
  slime.squashT = 0.1
  slime.jumpMul = p.type === 'sticky' ? STICKY_MUL : 1
  if (p.type === 'crumble' && !p.crackT) p.crackT = CRUMBLE_T
  sfx(SFX_LAND, 0, 0.2)
}

function updSlime(dt) {
  const prevY = slime.y
  if (slime.grounded) {
    const p = slime.groundPlat
    if (!p || slime.x < p.x - 10 || slime.x > p.x + p.w + 10) {
      if (p && p.type === 'ghost') {
        killPlat(p, C_GH_SIDE)
        sfx(SFX_COIN, -4, 0.4)
      }
      slime.grounded = false
      slime.groundPlat = null
    } else {
      slime.vx *= Math.pow(0.002, dt)
      if (Math.abs(slime.vx) < 2) slime.vx = 0
      slime.x += slime.vx * dt
      slime.y = p.y - slime.r
    }
  }
  if (!slime.grounded) {
    slime.vy += GRAV * dt
    if (slime.vy > 520) slime.vy = 520
    slime.vx *= Math.pow(0.6, dt)
    slime.x += slime.vx * dt
    slime.y += slime.vy * dt
    if (slime.y - slime.r < CEIL) { slime.y = CEIL + slime.r; if (slime.vy < 0) slime.vy = 0 }
    if (slime.vy >= 0) {
      for (const p of platforms) {
        if (slime.x > p.x - 6 && slime.x < p.x + p.w + 6 && prevY + slime.r <= p.y + 8 && slime.y + slime.r >= p.y) {
          land(p)
          break
        }
      }
    }
  }
  for (const p of platforms) {
    if (p.spike && slime.y + slime.r > p.y - 10 && slime.y + slime.r < p.y + 4 && slime.x > p.spike.x1 - 4 && slime.x < p.spike.x2 + 4) {
      slime.vy = -240
      slime.grounded = false
      slime.groundPlat = null
      damage()
      break
    }
  }
  if (slime.x + slime.r > camX + W - SPIKE_W) {
    slime.x = camX + W - SPIKE_W - slime.r - 2
    if (slime.vx > 0) slime.vx = -120
    damage()
  }
  if (slime.invuln > 0) slime.invuln -= dt
  if (slime.squashT > 0) slime.squashT -= dt
  slime.r = slimeR()
}

function updBalls() {
  for (const b of balls) {
    if (b.taken) continue
    if (dist(slime.x, slime.y, b.x, b.y) < slime.r + (b.gold ? 9 : 6)) {
      b.taken = true
      if (b.gold) {
        goldsCollected++
        sfx(SFX_COIN, 2, 1.2)
        burst(b.x, b.y, C_GOLD, 14, 160)
      } else {
        ballsCollected++
        sfx(SFX_COIN)
        burst(b.x, b.y, b.o ? C_ORANGE : C_YELLOW, 6, 90)
      }
    }
  }
}

function updParticles(dt) {
  for (const pt of particles) {
    pt.vy += 500 * dt
    pt.x += pt.vx * dt
    pt.y += pt.vy * dt
    pt.life -= dt
  }
  particles = particles.filter(p => p.life > 0)
}

function update(dt) {
  if (dt > 1) dt /= 1000
  if (iskeypressed('m')) toggleMute()
  if (state === 'title') { camX += 14 * dt; return }
  if (state === 'over') { deathT += dt; updParticles(dt); if (shakeT > 0) shakeT -= dt; return }
  elapsed += dt
  camSpd = Math.min(40 + Math.floor(elapsed / 10) * 5, 120)
  camX += camSpd * dt
  if (shakeT > 0) shakeT -= dt
  genUntil()
  cleanup()
  for (const p of platforms) {
    if (p.type === 'dynamic') p.y = p.baseY + Math.sin(T * p.spd + p.ph) * p.amp
    if (p.crackT > 0) {
      p.crackT -= dt
      if (p.crackT <= 0) {
        p.crackT = 0
        killPlat(p, C_CR_SIDE)
        sfx(SFX_DIE, 2, 0.3)
      }
    }
  }
  updSlime(dt)
  if (charge.on) {
    charge.t += dt
    if (!slime.grounded) charge.on = false
  }
  updBalls()
  updParticles(dt)
  musicT -= dt
  if (musicT < -0.5) musicT = 0
  const bpm = lerp(112, 150, (camSpd - 40) / 80)
  while (musicT <= 0) {
    musicStep = (musicStep + 1) % 16
    const bf = BASS_PAT[musicStep]
    if (bf) { const a = MUSIC_BASS.slice(); a[2] = bf; sfx(a) }
    const mf = LEAD_PAT[musicStep]
    if (mf) { const a = MUSIC_LEAD.slice(); a[2] = mf; sfx(a) }
    musicT += 60 / bpm / 4
  }
  if (slime.x + slime.r < camX) die()
  if (slime.y - slime.r > H + 30) die()
}

function toggleMute() {
  muted = !muted
  try { localStorage.setItem('slime_muted', muted ? '1' : '0') } catch (e) {}
  volume(muted ? 0 : 0.5)
}

function tap(x, y, touchId) {
  if (x < 28 && y < 28) { toggleMute(); return }
  if (state === 'title') { startGame(); return }
  if (state === 'over') { if (deathT > 0.7) startGame(); return }
  if (slime.grounded && !charge.on) {
    charge.on = true
    charge.t = 0
    charge.id = touchId
    charge.aim = { x: x + camX, y }
  }
}

function tapping(x, y, touchId) {
  if (charge.on && touchId === charge.id) charge.aim = { x: x + camX, y }
}

function untap(x, y, touchId) {
  if (charge.on && touchId === charge.id) {
    charge.on = false
    doJump()
  }
}

function bgLayer(f, seed, cb) {
  const off = camX * f
  const c0 = Math.floor(off / 64) - 1
  const c1 = Math.floor((off + W) / 64) + 1
  for (let c = c0; c <= c1; c++) {
    cb(c * 64 - off, h32(c * 91 + seed), h32(c * 137 + seed + 7), h32(c * 31 + seed + 13))
  }
}

function drawBG() {
  cls(C_BG0)
  bgLayer(0.22, 11, (x, h, h2, h3) => {
    rectfill(x, CEIL, 64, H - CEIL, C_BG1)
    if (h2 < 0.5) rectfill(x + 8 + h * 20, 30 + h3 * 60, 18 + h2 * 30, 26 + h * 40, C_BG2)
  })
  bgLayer(0.45, 77, (x, h, h2, h3) => {
    if (h < 0.3) rectfill(x + h3 * 44, 26 + h2 * 170, 5, 5, C_BG3)
    if (h > 0.82) rectfill(x + h2 * 44, 150 + h * 90, 10, 4, C_BG3)
  })
}

function drawTitle() {
  const word = 'SLIME'
  const px = 9
  const totalW = word.length * 6 * px - px
  let lx = (W - totalW) / 2
  for (let li = 0; li < word.length; li++) {
    const rows = LETTERS[word[li]]
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        if (rows[r][c] === '#') {
          rectfill(lx + c * px + 3, 48 + r * px + 3, px, px, C_BLACK)
        }
      }
    }
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 5; c++) {
        if (rows[r][c] === '#') {
          rectfill(lx + c * px, 48 + r * px, px, px, C_GREEN)
        }
      }
    }
    for (let c = 0; c < 5; c++) {
      if (rows[4][c] === '#' && h32(li * 31 + c * 7) < 0.4) {
        const dl = 1 + Math.floor(h32(li * 13 + c) * 3)
        rectfill(lx + c * px + 1, 48 + 5 * px, px - 2, dl * 4, C_GREEN)
      }
    }
    lx += 6 * px
  }
  const bob = Math.sin(T * 2.5) * 6
  drawBlob(W / 2, 128 + bob, 20, 1, 1, false)
  textalign('center', 'top')
  textsize(10)
  text(W / 2, 166, 'Maintiens pour charger, vise avec le curseur, relache', C_WHITE)
  alpha(0.55 + 0.45 * Math.sin(T * 3))
  text(W / 2, 182, "Vise meme vers l'arriere pour les billes dorees !", C_GOLD)
  alpha(1)
  textsize(12)
  alpha(0.55 + 0.45 * Math.sin(T * 3))
  text(W / 2, 200, 'Clique ou touche pour commencer', C_GREEN)
  alpha(1)
  if (best > 0) {
    textsize(11)
    text(W / 2, 222, 'RECORD : ' + best, C_GOLD)
  }
  textsize(8)
  text(W - 24, H - 12, 'v' + VERSION, C_GRAY)
  textalign('start', 'top')
}

function drawBlob(x, y, r, sx, sy, blink) {
  if (blink) return
  push(x, y, 0, sx, sy)
  circfill(0, -r * 0.3, r * 0.92 + 2, C_SLIME_D)
  rectfill(-r * 0.92 - 2, -r * 0.3, (r * 0.92 + 2) * 2, r * 1.3 + 2, C_SLIME_D)
  circfill(0, -r * 0.3, r * 0.92, C_SLIME)
  rectfill(-r * 0.92, -r * 0.3, r * 1.84, r * 1.3, C_SLIME)
  rectfill(-r * 0.92, r * 0.86, r * 1.84, r * 0.14, C_SLIME_D)
  circfill(-r * 0.3, -r * 0.35, r * 0.18, C_WHITE)
  circfill(r * 0.22, -r * 0.35, r * 0.18, C_WHITE)
  circfill(-r * 0.24, -r * 0.33, r * 0.09, C_BLACK)
  circfill(r * 0.28, -r * 0.33, r * 0.09, C_BLACK)
  alpha(0.7)
  circfill(-r * 0.45, -r * 0.72, r * 0.13, C_WHITE)
  alpha(1)
  pop()
}

function drawPlat(p) {
  if (p.dead) return
  if (p.type === 'sticky') {
    rectfill(p.x, p.y, p.w, 7, C_S_TOP)
    rectfill(p.x, p.y + 7, p.w, 7, C_S_SIDE)
    rectfill(p.x, p.y + 14, p.w, 2, C_S_DARK)
    for (let c = 4; c < p.w - 4; c += 11) {
      const dl = 3 + Math.floor(h32(p.x + c) * 7)
      rectfill(p.x + c, p.y + 16, 4, dl, C_S_SIDE)
      rectfill(p.x + c, p.y + 16 + dl - 2, 4, 2, C_S_DARK)
    }
  } else if (p.type === 'dynamic') {
    rectfill(p.x, p.y, p.w, 6, C_D_TOP)
    rectfill(p.x, p.y + 6, p.w, 8, C_D_SIDE)
    rectfill(p.x, p.y + 14, p.w, 2, C_D_DARK)
    for (let c = 4; c < p.w - 4; c += 16) rectfill(p.x + c, p.y + 2, 8, 2, C_WHITE)
  } else if (p.type === 'crumble') {
    const jx = p.crackT > 0 ? rand(-1.5, 1.5) : 0
    rectfill(p.x + jx, p.y, p.w, 6, C_CR_TOP)
    rectfill(p.x + jx, p.y + 6, p.w, 8, C_CR_SIDE)
    rectfill(p.x + jx, p.y + 14, p.w, 2, C_CR_DARK)
    rectfill(p.x + p.w * 0.3, p.y + 1, 2, 5, C_CR_DARK)
    rectfill(p.x + p.w * 0.6, p.y + 2, 2, 4, C_CR_DARK)
    rectfill(p.x + p.w * 0.45, p.y + 3, 2, 4, C_CR_DARK)
  } else if (p.type === 'ghost') {
    alpha(0.5 + 0.25 * Math.sin(T * 6))
    rectfill(p.x, p.y, p.w, 6, C_GH_TOP)
    rectfill(p.x, p.y + 6, p.w, 8, C_GH_SIDE)
    rectfill(p.x, p.y + 14, p.w, 2, C_GH_DARK)
    alpha(1)
  } else if (p.type === 'bouncy') {
    rectfill(p.x, p.y, p.w, 6, C_ORANGE)
    rectfill(p.x, p.y + 6, p.w, 8, C_BO_SIDE)
    rectfill(p.x, p.y + 14, p.w, 2, C_BO_DARK)
    for (let c = 6; c < p.w - 10; c += 14) {
      shape([p.x + c, p.y + 5, p.x + c + 5, p.y + 1, p.x + c + 10, p.y + 5])
      fill(C_WHITE)
    }
  } else {
    rectfill(p.x, p.y, p.w, 6, C_P_TOP)
    rectfill(p.x, p.y + 6, p.w, 8, C_P_SIDE)
    rectfill(p.x, p.y + 14, p.w, 2, C_P_DARK)
    for (let c = 3; c < p.w - 3; c += 9) rectfill(p.x + c, p.y - 2, 3, 2, C_P_TOP)
  }
  if (p.spike) {
    for (let sx = p.spike.x1; sx + 8 <= p.spike.x2 + 0.1; sx += 8) {
      shape([sx, p.y, sx + 4, p.y - 9, sx + 8, p.y])
      fill(C_RED)
    }
    rectfill(p.spike.x1, p.y - 2, p.spike.x2 - p.spike.x1, 2, C_RED_D)
  }
}

function drawBall(b) {
  if (b.gold) {
    const pu = 1 + 0.12 * Math.sin(T * 5)
    alpha(0.4)
    circ(b.x, b.y, 10 * pu, C_GOLD)
    alpha(1)
    circfill(b.x, b.y, 6.5, C_GOLD)
    circfill(b.x - 2, b.y - 2, 2, C_WHITE)
    return
  }
  circfill(b.x, b.y, 4, b.o ? C_ORANGE : C_YELLOW)
  circfill(b.x - 1.5, b.y - 1.5, 1.3, C_WHITE)
}

function drawTrajectory() {
  const p = 0.12 + 0.88 * Math.min(charge.t / CHARGE_T, 1)
  const v = lerp(VMIN, VMAX, p) * slime.jumpMul
  const ang = Math.atan2(charge.aim.y - slime.y, charge.aim.x - slime.x)
  let x = slime.x, y = slime.y
  let vx = Math.cos(ang) * v, vy = Math.sin(ang) * v
  const dt = 1 / 60
  let idx = 0
  for (let i = 0; i < 100; i++) {
    vy += GRAV * dt
    x += vx * dt
    y += vy * dt
    if (y - slime.r < CEIL) { y = CEIL + slime.r; if (vy < 0) vy = 0 }
    let hit = false
    if (vy >= 0) {
      for (const p2 of platforms) {
        if (p2.dead) continue
        if (x > p2.x - 6 && x < p2.x + p2.w + 6 && y + slime.r >= p2.y && y + slime.r <= p2.y + 14) { hit = true; break }
      }
    }
    if (i % 3 === 0) {
      alpha(0.85 - idx * 0.04)
      circfill(x, y, Math.max(1.2, 2.6 - idx * 0.12), C_WHITE)
      alpha(1)
      idx++
    }
    if (hit || y > H + 40 || x < camX - 40 || x > camX + W + 30) break
  }
}

function drawSlime() {
  const blink = slime.invuln > 0 && Math.floor(T * 18) % 2 === 0
  let sx = 1, sy = 1
  if (charge.on) {
    const c = Math.min(charge.t / CHARGE_T, 1)
    sy = 1 - 0.28 * c
    sx = 1 + 0.22 * c
  } else if (slime.squashT > 0) {
    sx = 1.22
    sy = 0.78
  } else if (!slime.grounded) {
    const st = clamp(Math.abs(slime.vy) / 500, 0, 1)
    sy = 1 + 0.16 * st
    sx = 1 - 0.1 * st
  }
  alpha(blink ? 0.35 : 1)
  drawBlob(slime.x, slime.y, slime.r, sx, sy, false)
  alpha(1)
}

function drawParticles() {
  for (const p of particles) {
    alpha(clamp(p.life * 2, 0, 1))
    circfill(p.x, p.y, p.r, p.c)
  }
  alpha(1)
}

function drawSpikeWall() {
  rectfill(W - 5, 0, 5, H, C_RED_D)
  for (let y = 2; y < H; y += 11) {
    shape([W - 4, y, W - SPIKE_W - 2, y + 5.5, W - 4, y + 11])
    fill(C_RED)
  }
}

function drawCeiling() {
  rectfill(0, 0, W, CEIL, C_BLACK)
  rectfill(0, CEIL, W, 2, C_BG1)
}

function drawVoid() {
  alpha(0.45)
  rectfill(0, H - 22, W, 22, C_BLACK)
  alpha(1)
}

function drawHUD() {
  circfill(16, H - 15, 8, C_SLIME)
  rectfill(8, H - 15, 16, 8, C_SLIME)
  circfill(13, H - 17, 1.6, C_WHITE)
  circfill(19, H - 17, 1.6, C_WHITE)
  circfill(13.8, H - 17, 0.8, C_BLACK)
  circfill(19.8, H - 17, 0.8, C_BLACK)
  for (let i = 0; i < 3; i++) {
    const filled = i < slime.size
    const col = !filled ? C_BLACK : (slime.size === 1 ? (Math.floor(T * 6) % 2 ? C_RED : C_SLIME) : C_SLIME)
    rectfill(30 + i * 21, H - 20, 18, 10, col)
    rect(30 + i * 21, H - 20, 18, 10, C_GRAY)
  }
  const ratio = (camSpd - 40) / 80
  textsize(8)
  text(W - 74, 4, 'VITESSE', C_GRAY)
  rectfill(W - 76, 13, 66, 8, C_BLACK)
  rectfill(W - 74, 15, Math.round(62 * ratio), 4, ratio < 0.5 ? C_SLIME : (ratio < 0.8 ? C_ORANGE : C_RED))
  rect(W - 76, 13, 66, 8, C_GRAY)
  textsize(9)
  if (slime.x - slime.r < camX + 40) {
    alpha(0.4 + 0.3 * Math.sin(T * 12))
    rectfill(0, CEIL, 5, H - CEIL, C_RED)
    textalign('center', 'top')
    textsize(10)
    text(30, 60, 'DANGER', C_RED)
    alpha(1)
    textalign('start', 'top')
  }
}

function drawOver() {
  alpha(0.65)
  rectfill(0, 0, W, H, C_BLACK)
  alpha(1)
  textalign('center', 'top')
  textsize(26)
  text(W / 2, 44, 'PERDU !', C_RED, 'bold')
  if (newRecord) {
    alpha(0.55 + 0.45 * Math.sin(T * 6))
    textsize(13)
    text(W / 2, 78, 'NOUVEAU RECORD !', C_GOLD, 'bold')
    alpha(1)
  }
  textsize(9)
  text(W / 2, 100, 'CODE DE SCORE', C_GRAY)
  rectfill(58, 110, W - 116, 32, C_BG1)
  rect(58, 110, W - 116, 32, C_GRAY)
  textsize(9)
  text(W / 2, 121, scoreCode, C_WHITE)
  textsize(8)
  text(W / 2, 156, 'Donne ce code au createur pour valider ton score', C_GRAY)
  if (deathT > 0.7) {
    alpha(0.55 + 0.45 * Math.sin(T * 4))
    textsize(12)
    text(W / 2, 196, 'TAPE POUR REJOUER', C_GREEN)
    alpha(1)
  }
  textalign('start', 'top')
}

function draw() {
  drawBG()
  if (state === 'title') { drawTitle(); return }
  const shx = shakeT > 0 ? rand(-3, 3) : 0
  const shy = shakeT > 0 ? rand(-3, 3) : 0
  push(Math.round(-camX) + shx, shy)
  for (const p of platforms) drawPlat(p)
  for (const b of balls) if (!b.taken) drawBall(b)
  drawParticles()
  drawSlime()
  if (charge.on) drawTrajectory()
  pop()
  drawSpikeWall()
  drawCeiling()
  drawVoid()
  drawHUD()
  if (state === 'over') drawOver()
  drawSoundIcon()
}

function drawSoundIcon() {
  alpha(0.85)
  rectfill(9, 11, 5, 8, C_WHITE)
  shape([14, 11, 22, 5, 22, 25, 14, 19])
  fill(C_WHITE)
  if (muted) {
    line(24, 9, 31, 21, C_RED)
    line(31, 9, 24, 21, C_RED)
  } else {
    circ(25, 15, 4, C_WHITE)
    circ(25, 15, 7, C_WHITE)
  }
  alpha(1)
}

function init() {
  pal(COLORS, C_WHITE)
  textsize(9)
  try {
    best = parseInt(localStorage.getItem('slime_best') || '0', 10) || 0
    muted = localStorage.getItem('slime_muted') === '1'
  } catch (e) {}
  volume(muted ? 0 : 0.5)
  const cv = canvas()
  cv.style.imageRendering = 'pixelated'
}
</script>
