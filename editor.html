<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SLIME — Éditeur</title>
<link rel="icon" href="data:,"/>
<style>
  /* Échelle UI relative : 1rem suit la taille de l'écran (≈13px à 1920×1080,
     plancher 10px, plafond 16px) — tout rétrécit sur un écran de plus faible
     résolution au lieu de déborder. Bordures fines gardées en px (netteté). */
  html { font-size: clamp(10px, min(0.68vw, 1.2vh), 16px); }
  :root {
    --bg: #0d1126; --panel: #131735; --panel2: #1c2148; --line: #2e2e5e;
    --txt: #d8e8f4; --dim: #8a8ab0; --acc: #3ecb3e; --gold: #ffd83d; --red: #e23b3b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--txt);
    font: 1rem/1.4 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  header {
    display: flex; align-items: center; gap: .62rem; padding: .62rem .92rem;
    background: var(--panel); border-bottom: 2px solid var(--line); flex-wrap: wrap;
  }
  .logo { font-weight: 800; letter-spacing: .06em; color: var(--acc); font-size: 1.23rem; margin-right: .46rem; }
  .logo small { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .tabs { display: flex; gap: .15rem; margin-right: .77rem; }
  .tab {
    padding: .46rem 1.08rem; background: var(--panel2); border: 1px solid var(--line);
    color: var(--dim); cursor: pointer; font-weight: 700; font-size: .92rem;
  }
  .tab.on { background: var(--acc); color: #062806; border-color: var(--acc); }
  button, label.filebtn {
    padding: .46rem .77rem; background: var(--panel2); border: 1px solid var(--line);
    color: var(--txt); cursor: pointer; font-size: .92rem; font-weight: 600;
  }
  button:hover, label.filebtn:hover { border-color: var(--acc); color: #fff; }
  button.danger:hover { border-color: var(--red); }
  button:disabled { opacity: .4; cursor: default; }
  .spacer { flex: 1; }
  main { flex: 1; display: flex; min-height: 0; }
  aside { background: var(--panel); overflow-y: auto; }
  #list { width: 17.85rem; flex: 0 0 17.85rem; border-right: 2px solid var(--line); padding: .62rem; }
  #propsResize {
    flex: 0 0 .38rem; cursor: col-resize; touch-action: none;
    background: var(--panel); border-left: 2px solid var(--line);
  }
  #propsResize:hover, #propsResize.on { background: var(--acc); }
  #props { width: 20.92rem; flex: 0 0 auto; min-width: 15.38rem; max-width: 43.08rem; padding: .77rem; }
  #center { flex: 1; position: relative; background: #0a0d1e; min-width: 0; display: flex; flex-direction: column; }
  #toolbar {
    display: flex; gap: .31rem; padding: .46rem .62rem; background: var(--panel);
    border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap;
  }
  #toolbar .grp { display: flex; gap: .15rem; align-items: center; padding-right: .62rem; margin-right: .31rem; border-right: 1px solid var(--line); }
  .tool.on { background: var(--acc); color: #062806; border-color: var(--acc); }
  canvas#cv { flex: 1; display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; }
  footer {
    padding: .38rem .92rem; background: var(--panel); border-top: 2px solid var(--line);
    color: var(--dim); font-size: .92rem; display: flex; gap: 1.23rem; align-items: center;
  }
  #status.ok { color: var(--acc); } #status.ko { color: var(--red); }
  /* liste des patterns */
  .item {
    padding: .54rem .62rem; margin-bottom: .31rem; background: var(--panel2);
    border: 1px solid var(--line); cursor: pointer; display: flex; gap: .62rem; align-items: center;
  }
  .item:hover { border-color: var(--dim); }
  .item.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .tier {
    width: 1.54rem; height: 1.54rem; flex: 0 0 1.54rem; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: .85rem; color: #0a0a12; border-radius: 3px;
  }
  .item .nm { flex: 1; min-width: 0; }
  .item .nm b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .92rem; }
  .item .nm span { color: var(--dim); font-size: .85rem; }
  .item .mini { display: flex; flex-direction: column; gap: .15rem; }
  .item .mini button { padding: .08rem .38rem; font-size: .77rem; }
  .hint { color: var(--dim); font-size: .92rem; padding: .77rem; line-height: 1.5; }
  /* panneau propriétés */
  h3 { font-size: .85rem; letter-spacing: .09em; color: var(--dim); margin: .77rem 0 .46rem; text-transform: uppercase; }
  h3:first-child { margin-top: 0; }
  .row { display: flex; flex-wrap: wrap; gap: .46rem; margin-bottom: .46rem; align-items: center; }
  .row label { width: 5.69rem; flex: 0 0 5.69rem; color: var(--dim); font-size: .92rem; }
  .row input[type=text], .row input[type=number], .row select {
    flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    color: var(--txt); padding: .31rem .46rem; font: inherit;
  }
  .row input[type=range] { flex: 1; }
  .row .val { min-width: 3.38rem; flex: 0 0 auto; text-align: right; color: var(--gold); font-size: .92rem; }
  .chk { display: flex; align-items: center; gap: .46rem; margin-bottom: .46rem; font-size: .92rem; }
  .badge { display: inline-block; padding: .15rem .62rem; font-size: .85rem; font-weight: 700; border-radius: 3px; }
  .badge.ok { background: #123c12; color: var(--acc); }
  .badge.ko { background: #3c1212; color: var(--red); }
  .note { color: var(--dim); font-size: .85rem; line-height: 1.5; margin-top: .62rem; }
  .empty { color: var(--dim); text-align: center; padding: 2.31rem .77rem; line-height: 1.6; }
  input[type=file] { display: none; }
  /* onglets VUE : plein cadre, sans liste ni barre d'outils */
  main.layout #list, main.layout #toolbar { display: none; }
  /* onglets PHYS, POWER et COULEURS : la vue des réglages prend toute la zone de l'éditeur */
  main.phys #list, main.phys #center, main.phys #propsResize { display: none; }
  main.power #list, main.power #center, main.power #propsResize { display: none; }
  main.colors #list, main.colors #center, main.colors #propsResize { display: none; }
  main.phys #props, main.power #props, main.colors #props {
    flex: 1; width: auto; max-width: 89.23rem; margin: 0 auto;
    border-left: none; padding: 1.23rem 1.54rem;
  }
  .physHead {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1.23rem; margin-bottom: 1.08rem;
  }
  .physHead h3 { font-size: 1.08rem; color: var(--txt); }
  .physHead .note { margin-top: .31rem; max-width: 60rem; }
  .physGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(21.54rem, 1fr)); gap: .92rem; }
  .physCard { background: var(--panel2); border: 1px solid var(--line); padding: .92rem; align-self: start; }
  .physCard .row label { width: 7.08rem; flex: 0 0 7.08rem; }
  /* bouton « Appliquer au jeu » (PHYS / POWER) + état modifications non appliquées */
  .applyCol { display: flex; flex-direction: column; align-items: flex-end; gap: .31rem; flex: 0 0 auto; }
  .btnRow { display: flex; gap: .46rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .applyBtn.dirty { background: var(--gold); color: #0a0a12; border-color: var(--gold); }
  .dirtyNote { color: var(--gold); font-size: .85rem; font-weight: 700; }
  /* ---------- portail mot de passe (style présentation) ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, #10173a 0%, transparent 60%),
      var(--bg);
  }
  #gateCard {
    background: var(--panel); border: 2px solid var(--line); padding: 2.62rem 2.92rem;
    text-align: center; box-shadow: 0 .62rem 0 #0a0a12; max-width: 26.15rem;
  }
  #gateCard.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-.62rem) } 75% { transform: translateX(.62rem) } }
  #gateCard .gl {
    font-size: 2.31rem; font-weight: 900; letter-spacing: .08em; color: var(--acc);
    text-shadow: 0 .23rem 0 #12521d, 0 .46rem 0 #0a0a12, 0 0 1.69rem rgba(62,203,62,.45);
  }
  #gateCard .gl small { display: block; font-size: .92rem; font-weight: 700; color: var(--gold); letter-spacing: .4em; margin-top: .46rem; }
  #gateCard p { color: var(--dim); font-size: 1rem; margin: 1.08rem 0 1.23rem; }
  #gatePwd {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--txt);
    padding: .77rem .92rem; font: inherit; text-align: center; letter-spacing: .2em;
  }
  #gateBtn {
    width: 100%; margin-top: .92rem; padding: .85rem 0; font-weight: 800; cursor: pointer;
    background: var(--acc); color: #062806; border: 0; box-shadow: 0 .31rem 0 #12521d, 0 .46rem 0 #0a0a12;
    letter-spacing: .06em;
  }
  #gateBtn:active { transform: translateY(2px); }
  #gateErr { color: var(--red); font-size: .92rem; min-height: 1.23rem; margin-top: .77rem; font-weight: 700; }
  /* onglet COULEURS : une carte par palier (preview slime + seuil + teinte) */
  .tierRow { display: flex; align-items: center; gap: .77rem; background: var(--bg); border: 1px solid var(--line); padding: .62rem .77rem; margin-top: .62rem; }
  .tierRow canvas { width: 4.31rem; height: 4.31rem; image-rendering: pixelated; background: var(--panel2); border-radius: 4px; flex: 0 0 4.31rem; }
  .tierRow .col { display: flex; flex-direction: column; gap: .23rem; font-size: .85rem; color: var(--dim); }
  .tierRow .col input[type=number] { width: 6.62rem; background: var(--bg); border: 1px solid var(--line); color: var(--txt); padding: .31rem .46rem; font: inherit; }
  .tierRow input[type=color] { width: 3.38rem; height: 2.77rem; border: 1px solid var(--line); background: var(--bg); padding: .15rem; cursor: pointer; }
  .tierRow input[type=color]:disabled, .tierRow input[type=number]:disabled { opacity: .45; cursor: not-allowed; }
  .tierRow .range { color: var(--dim); font-size: .85rem; flex: 1; }
  .tierRow .del { flex: 0 0 auto; }
  .tierRow select { background: var(--bg); border: 1px solid var(--line); color: var(--txt); padding: .31rem; font: inherit; font-size: .85rem; }
  .tierRow select:disabled { opacity: .45; cursor: not-allowed; }
  .tierRow input[type=range] { width: 7.38rem; }
  .tierRow .stops { display: flex; gap: .31rem; align-items: center; flex-wrap: wrap; }
  .tierRow .spd { display: flex; gap: .46rem; align-items: center; }
  .tierRow .val { min-width: 3.54rem; text-align: right; color: var(--gold); font-size: .85rem; }
  .stopbtn { padding: .31rem .62rem; font-size: .85rem; line-height: 1; }
  .stopbtn:disabled { opacity: .35; }
  .tierGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(25.38rem, 1fr)); gap: .77rem; margin-top: .77rem; }
  .tierGrid .tierRow { margin-top: 0; }
</style>
</head>
<body>
<div id="gate">
  <div id="gateCard">
    <div class="gl">SLIME<small>EDITEUR</small></div>
    <p>Acces protege. Mot de passe ?</p>
    <input type="password" id="gatePwd" autocomplete="current-password" placeholder="••••"/>
    <button id="gateBtn">OK</button>
    <div id="gateErr"></div>
  </div>
</div>
<header>
  <div class="logo">SLIME <small>éditeur</small></div>
  <div class="tabs">
    <div class="tab on" id="tabPatterns" title="Créer et éditer les sections de plateformes">PATTERNS</div>
    <div class="tab" id="tabLayout" title="Zoom de la vue, hitboxes des murs et placement des assets">VUE</div>
    <div class="tab" id="tabPhys" title="Physique du jeu : slime, saut, caméra, game feel">PHYS</div>
    <div class="tab" id="tabPower" title="Pouvoirs : double saut, slow-mo, cooldowns, activation">POWER</div>
    <div class="tab" id="tabColors" title="Couleurs du slime par palier de score">COULEURS</div>
  </div>
  <span class="spacer"></span>
  <button id="btnNew">+ Nouveau</button>
  <button id="btnDefaults" title="Remplace ta liste par les 20 sections du pool par défaut (⚠ les patterns actuels sont perdus)">Restaurer défauts</button>
  <button id="btnExport" title="Télécharger tes patterns en .json (les réglages du jeu ne sont pas exportés)">Exporter patterns .json</button>
  <label class="filebtn" for="fileImport" title="Importer des patterns depuis un .json (les réglages du jeu ne sont pas touchés)">Importer patterns .json</label>
  <input type="file" id="fileImport" accept=".json,application/json"/>
  <button id="btnCopy" title="Code compact des patterns (sans les réglages) à coller sur une autre machine">Copier code</button>
  <button id="btnPaste" title="Coller un code de patterns venu d'une autre machine (les réglages du jeu ne sont pas touchés)">Coller code</button>
  <button id="btnPlay" title="Jouer le pattern sélectionné en boucle">▶ Playtest</button>
</header>
<main>
  <aside id="list"></aside>
  <section id="center">
    <div id="toolbar"></div>
    <canvas id="cv"></canvas>
  </section>
  <div id="propsResize" title="Glisser pour redimensionner le panneau"></div>
  <aside id="props"></aside>
</main>
<footer>
  <span id="coords">—</span>
  <span id="status"></span>
  <span class="spacer"></span>
  <span id="storeInfo"></span>
  <button id="btnLock" title="Verrouiller l'editeur (oublier le mot de passe)">🔒</button>
</footer>
<script src="js/physics.js?v=20260926a"></script>
<script src="js/slime-colors.js?v=20260927a"></script>
<script src="js/sprites.js?v=20260927a"></script>
<script src="js/patterns-defaults.js?v=20260925b"></script>
<script src="js/patterns.js?v=20260926d"></script>
<script src="js/crypto.js?v=20260926d"></script>
<script>
// ---------- portail : editor.js n'est charge qu'apres le bon mot de passe ----------
// Hash sale de la cle : la source ne contient pas le mot de passe en clair, et
// la cle est conservee pour l'API LAN (en-tete X-Slime-Key sur PUT /api/state).
(function () {
  var SALT = 'slime::editeur::2026'
  var HASH = '62392f80d2b3003249b4c267b06241c8d02ae30f803037bed3bed3d65b3373bf'
  var KEY_STORE = 'slime_key'

  function getKey() {
    try { return localStorage.getItem(KEY_STORE) || '' } catch (e) { return '' }
  }
  function unlocked() {
    try { return Crypto.digestHex(SALT + getKey()) === HASH } catch (e) { return false }
  }
  function loadEditor() {
    var s = document.createElement('script')
    s.src = 'js/editor.js?v=20260927d'
    document.body.appendChild(s)
  }
  function fail(msg) {
    document.getElementById('gateErr').textContent = msg
    var card = document.getElementById('gateCard')
    card.classList.remove('shake')
    void card.offsetWidth
    card.classList.add('shake')
  }
  function tryUnlock() {
    var v = document.getElementById('gatePwd').value
    if (Crypto.digestHex(SALT + v) === HASH) {
      try { localStorage.setItem(KEY_STORE, v) } catch (e) {}
      document.getElementById('gate').style.display = 'none'
      loadEditor()
    } else fail('Mot de passe incorrect')
  }

  var lock = document.getElementById('btnLock')
  if (lock) lock.addEventListener('click', function () {
    try { localStorage.removeItem(KEY_STORE) } catch (e) {}
    location.reload()
  })

  if (unlocked()) {
    document.getElementById('gate').style.display = 'none'
    loadEditor()
  } else {
    document.getElementById('gateBtn').addEventListener('click', tryUnlock)
    document.getElementById('gatePwd').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') tryUnlock()
    })
    try { document.getElementById('gatePwd').focus() } catch (e) {}
  }
})()
</script>
</body>
</html>
